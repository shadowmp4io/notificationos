<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notifications Liquid Glass</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--sub:rgba(255,255,255,.78)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#1b3bd4;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;
font-family:-apple-system,"SF Pro Display","PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.bg{position:fixed;inset:0;overflow:hidden;background:linear-gradient(160deg,#1a37c9 0%,#2c4bd8 45%,#6a73e3 100%)}
.bl{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.b1{width:70vmax;height:50vmax;left:-22vmax;top:-18vmax;background:#d2479b;opacity:.55;animation:f1 14s ease-in-out infinite alternate}
.b2{width:55vmax;height:55vmax;right:-20vmax;top:-14vmax;background:#fff;opacity:.8;animation:f2 17s ease-in-out infinite alternate}
.b3{width:75vmax;height:55vmax;left:8vmax;bottom:-32vmax;background:#c9ccff;opacity:.65;animation:f3 19s ease-in-out infinite alternate}
.sw{position:absolute;width:150vmax;height:80vmax;left:-25vmax;top:56%;border-radius:50%;border-top:2px solid rgba(255,255,255,.5);filter:blur(1.2px);transform:rotate(-26deg)}
@keyframes f1{to{transform:translate(14vmax,9vmax) scale(1.15)}}
@keyframes f2{to{transform:translate(-12vmax,10vmax) scale(.9)}}
@keyframes f3{to{transform:translate(-10vmax,-6vmax) scale(1.12)}}
#list{position:fixed;left:50%;top:calc(11vh - 50px);transform:translateX(-50%);max-height:calc(89vh - 74px);padding:50px 24px 60px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#list::-webkit-scrollbar{display:none}
#in{position:relative}
.cr{position:absolute;left:0;top:0;height:80px;pointer-events:none;will-change:transform;transform-origin:50% 0}
.rig{position:absolute;inset:0;transform-origin:50% 40px;will-change:transform;pointer-events:none}
.m{position:absolute;left:0;top:0;width:calc(100% + 40px);height:270px;pointer-events:none;opacity:0}
.cr.dis .cd{-webkit-mask-image:linear-gradient(90deg,transparent var(--ea),#000 var(--eb));mask-image:linear-gradient(90deg,transparent var(--ea),#000 var(--eb))}
.glass{-webkit-backdrop-filter:blur(24px) saturate(190%) brightness(1.08);backdrop-filter:blur(24px) saturate(190%) brightness(1.08);
background:radial-gradient(220px 110px at var(--sx,30%) var(--sy,0%),rgba(255,255,255,var(--ha,.34)),transparent 70%)}
.rim{filter:drop-shadow(0 14px 18px rgba(8,16,90,.28))}
.hit{position:absolute;left:0;top:0;pointer-events:auto;cursor:grab;overflow:hidden;touch-action:pan-y}
.av{position:absolute;left:16px;top:14px;width:52px;height:52px}
.av i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,#ffb24a,#e8453c,#3aa0ff,#b46bff,#ffd36b,#ffb24a);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.av b{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:#34c759;display:grid;place-items:center;border:2px solid rgba(255,255,255,.3)}
.tx{position:absolute;left:82px;right:20px;top:17px}
.r{display:flex;justify-content:space-between;gap:10px;height:20px;margin-bottom:5px}
.nm{font-weight:600;font-size:16px}
.tm{font-size:13px;color:var(--sub);white-space:nowrap}
.ms{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex{position:absolute;left:82px;right:20px;top:42px;font-size:17px;line-height:1.42;opacity:0}
.acts{position:absolute;left:16px;right:16px;bottom:16px;height:42px;opacity:0;pointer-events:none}
.acts>*{position:absolute;top:0;height:42px;border-radius:21px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.2);color:#fff;font-weight:600;font-size:15px;line-height:40px;font-family:inherit;cursor:pointer;text-align:center;padding:0;overflow:hidden}
.acts .del{background:rgba(255,92,92,.34);z-index:1}
.acts .conf{background:rgba(255,69,58,.88);border-color:rgba(255,255,255,.55);z-index:0;opacity:0;pointer-events:none}
.rep{left:0;z-index:3;background:rgba(255,255,255,.26)}
.rep span,.rep em{position:absolute;inset:0;font-style:normal;white-space:nowrap}
.rep input{position:absolute;inset:0;width:100%;height:100%;border:0;background:none;outline:0;color:#fff;font-weight:500;font-size:15px;font-family:inherit;padding:0 18px;opacity:0;pointer-events:none;user-select:text;-webkit-user-select:text}
.rep input::placeholder{color:rgba(255,255,255,.72)}
.rep em{opacity:0;transition:opacity .25s}
.sent .rep em{opacity:1}
.sent .rep input{opacity:0!important}
.send{width:42px;display:grid;place-items:center;opacity:0;background:#fff;border-color:#fff;color:#3b55e6;pointer-events:none;z-index:3}
.sa{transition:transform .45s cubic-bezier(.5,0,.2,1),opacity .35s}
.sent .sa{transform:translate(20px,-20px) scale(.5);opacity:0}
.trash{position:absolute;left:0;top:11px;width:58px;height:58px;padding:0;border:0;background:none;display:grid;place-items:center;opacity:0;pointer-events:none;cursor:pointer;border-radius:50%}
.trash:focus-visible{outline:2px solid #fff;outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#hint{position:fixed;left:0;right:0;bottom:calc(11vh + 14px);text-align:center;font-size:14px;color:var(--sub);opacity:0;transition:opacity .7s;padding:0 20px;pointer-events:none}
#empty{position:fixed;left:0;right:0;top:36vh;text-align:center;font-size:15px;color:var(--sub);opacity:0;transition:opacity .6s;pointer-events:none}
#add,#clr{position:fixed;left:50%;margin-left:-46px;bottom:calc(4.5vh + env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.14);
-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font-size:22px;line-height:34px;padding:0;cursor:pointer;opacity:.62;z-index:6;transition:transform .5s cubic-bezier(.3,1.8,.5,1),opacity .3s,background .3s}
#add:hover,#clr:hover{opacity:1;background:rgba(255,255,255,.24)}
#add:active{transform:scale(.82) rotate(90deg)}
#clr:active{transform:scale(.82)}
#fold{position:absolute;left:50%;top:0;margin-left:-60px;width:120px;height:30px;border-radius:15px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font-weight:600;font-size:13px;line-height:28px;font-family:inherit;padding:0;cursor:pointer;opacity:0;pointer-events:none;z-index:200;will-change:transform}
.conf i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.7);transform-origin:left;pointer-events:none}
.acts .conf.arm{animation:pulse 1.1s ease-in-out infinite}
#clr{margin-left:8px;display:grid;place-items:center}
#clr.off{opacity:0!important;pointer-events:none}
.cr.dis.rev .cd{-webkit-mask-image:linear-gradient(90deg,#000 var(--ea),transparent var(--eb));mask-image:linear-gradient(90deg,#000 var(--ea),transparent var(--eb))}
.fill{position:absolute;display:none;z-index:5;pointer-events:none;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.66),rgba(150,205,255,.52));border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.9);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);overflow:hidden;color:#1f3fd0;font-weight:700;font-size:17px}
.fill>div{text-align:center}
.fill i{width:46px;height:46px;border-radius:50%;background:#34c759;display:grid;place-items:center;margin:0 auto 8px;transform:scale(0);transition:transform .55s cubic-bezier(.3,1.9,.5,1) .3s}
.fill.on i{transform:scale(1)}
.fill svg path{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .45s cubic-bezier(.4,.9,.3,1) .55s}
.fill.on svg path{stroke-dashoffset:0}
.fill span{display:block;opacity:0;transform:translateY(6px);transition:opacity .4s .6s,transform .5s cubic-bezier(.3,1.6,.5,1) .6s}
.fill.on span{opacity:1;transform:none}
@keyframes pulse{50%{box-shadow:0 0 18px rgba(255,69,58,.75)}}
</style>
</head>
<body>
<div class="bg"><div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div><div class="sw"></div></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="460" y2="170"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/></linearGradient>
  <linearGradient id="gf" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="170"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/></linearGradient>
</defs></svg>
<div id="list"><div id="in"><button id="fold">Afficher moins</button></div></div>
<div id="empty">Aucune notification</div>
<canvas id="fx"></canvas>
<div id="hint">Touche pour ouvrir, glisse à gauche ou à droite pour supprimer</div>
<button id="add" aria-label="Ajouter une notification">+</button>
<button id="clr" aria-label="Tout effacer" title="Tout effacer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg></button>
<script>
(()=>{
const $=s=>document.querySelector(s),clr=$('#clr'),list=$('#list'),inner=$('#in'),fx=$('#fx'),hint=$('#hint'),empty=$('#empty'),ctx=fx.getContext('2d');
const T=58,REV=72,BASE=8,GAP=10,clamp=(a,b,c)=>Math.min(c,Math.max(b,a)),f=n=>(+n).toFixed(1);
const sp=(o,a,b,t,K,C,h)=>{o[b]+=(-K*(o[a]-t)-C*o[b])*h;o[a]+=o[b]*h};
const cards=[],PARTS=[];let SW=0,dpr=Math.min(devicePixelRatio||1,2);
const PAIRS=[['p','v','t'],['x','xv',0],['E','Ev','Et'],['e','ev','et'],['q','qv',0],['R','Rv','Rt'],['Sd','Sv','St'],['w','wv',0],['pr','prv','prt'],['Cf','Cv','Ct'],['L','Lv','Lt'],['sq','sqv',0],['Mg','Mgv','Mt'],['Fl','Flv','Ft']];
function size(){SW=Math.min(innerWidth*.92,460);list.style.width=(SW+48)+'px';cards.forEach(c=>{c.el.style.width=SW+'px';c.fr=0});fx.width=innerWidth*dpr;fx.height=innerHeight*dpr}
addEventListener('resize',size);size();
const vib=p=>{if(navigator.vibrate)navigator.vibrate(p)};

const TPL=`<div class="rig"><div class="m glass"></div>
<svg class="m rim"><path fill="url(#gf)" stroke="url(#gs)" stroke-width="1.3"/></svg>
<div class="m cd"><div class="hit">
<div class="av"><i></i><b><svg viewBox="0 0 24 24" width="13" height="13"><path fill="#fff" d="M12 4C7.6 4 4 7 4 10.8c0 2.1 1.1 4 2.9 5.2L6.3 19l3-1.5c.8.2 1.7.3 2.7.3 4.4 0 8-3 8-6.9S16.4 4 12 4z"/></svg></b></div>
<div class="tx"><div class="r"><span class="nm"></span><span class="tm"></span></div><div class="ms"></div></div>
<div class="ex"></div>
<div class="acts"><button class="conf"><i></i>Confirmer</button><button class="del">Supprimer</button><div class="rep" role="button" tabindex="0"><span>Répondre</span><input placeholder="Écrire un message…" autocomplete="off" enterkeyhint="send"><em>Envoyé ✓</em></div><button class="send" aria-label="Envoyer"><svg class="sa" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
<div class="fill"><div><i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>Message envoyé</span></div></div>
</div></div>
<button class="trash" aria-label="Supprimer la notification"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></div>`;

const DATA=[
 {n:'梦洁',t:'25分钟前',m:'我在松山湖等你，这里太适合拍照了，快来哦'},
 {n:'Lucas',t:'maintenant',m:'On se retrouve à 19h au café ? J’ai réservé une table pour quatre.',h:200},
 {n:'Maman',t:'2 min',m:'N’oublie pas d’appeler Mamie ce soir, elle t’attend avec impatience !',h:330},
 {n:'小林',t:'刚刚',m:'今晚的火锅局还去吗？我已经订好位子了，别迟到哦',h:20},
 {n:'Inès',t:'5 min',m:'Les photos du week-end sont incroyables, regarde le dossier partagé !',h:140},
 {n:'Théo',t:'8 min',m:'Match annulé à cause de la pluie, on reporte à samedi prochain.',h:260}
];let di=0;

/* formes */
function shape(ox,cw,ch,r,ccx,rx,ry,B){
  const R=ox+cw;
  let d='M'+f(ox+r)+' 0H'+f(R-r)+'A'+f(r)+' '+f(r)+' 0 0 1 '+f(R)+' '+f(r);
  const link=B>.02&&rx>2;
  if(link){
    const a=.96*B,h1=11*Math.pow(B,.7),w=7*B*B,px=ccx-rx*Math.cos(a),ys=ry*Math.sin(a),dd=px-R;
    d+='V'+f(40-h1)+'C'+f(R+dd*.5)+' '+f(40-w)+' '+f(px-dd*.5)+' '+f(40-w)+' '+f(px)+' '+f(40-ys)
      +'A'+f(rx)+' '+f(ry)+' 0 1 1 '+f(px)+' '+f(40+ys)
      +'C'+f(px-dd*.5)+' '+f(40+w)+' '+f(R+dd*.5)+' '+f(40+w)+' '+f(R)+' '+f(40+h1);
  }
  d+='V'+f(ch-r)+'A'+f(r)+' '+f(r)+' 0 0 1 '+f(R-r)+' '+f(ch)+'H'+f(ox+r)+'A'+f(r)+' '+f(r)+' 0 0 1 '+f(ox)+' '+f(ch-r)+'V'+f(r)+'A'+f(r)+' '+f(r)+' 0 0 1 '+f(ox+r)+' 0Z';
  return link?d:d+circ(ccx,rx,ry);
}
function circ(cx,rx,ry){return rx>1?'M'+f(cx-rx)+' 40A'+f(rx)+' '+f(ry)+' 0 1 1 '+f(cx+rx)+' 40A'+f(rx)+' '+f(ry)+' 0 1 1 '+f(cx-rx)+' 40Z':''}
const nz=(y,c)=>26*Math.sin(y*.09+1.3+c*4)+14*Math.sin(y*.23+.4-c*6)+(Math.abs(Math.sin(Math.floor(y/2)*127.1)*43758.5453)%1)*12-6;
const eb=(ox,cw,c)=>ox-60+(cw+120)*c;
function dust(ox,cw,ch,r,c,rev){
  const R=ox+cw,base=eb(ox,cw,c),A=[],Bk=[];
  for(let y=0;y<=ch;y+=2){
    const yy=clamp(y,.01,ch-.01);let dx=0;
    if(yy<r)dx=r-Math.sqrt(r*r-(r-yy)*(r-yy));else if(yy>ch-r)dx=r-Math.sqrt(r*r-(yy-ch+r)*(yy-ch+r));
    const rt=rev?Math.min(R-dx,R+60-(cw+120)*c+nz(yy,c)):R-dx,l=rev?ox+dx:Math.max(ox+dx,base+nz(yy,c));
    if(l<rt-1){A.push(f(rt)+' '+f(yy));Bk.push(f(l)+' '+f(yy))}
  }
  return A.length<2?'M0 0Z':'M'+A.join('L')+'L'+Bk.reverse().join('L')+'Z';
}

/* particules */
const spr={},rgb=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16)).join(',');
function sprite(c){if(spr[c])return spr[c];const k=document.createElement('canvas');k.width=k.height=32;const x=k.getContext('2d'),r=x.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'rgba('+rgb(c)+',1)');r.addColorStop(.3,'rgba('+rgb(c)+',.6)');r.addColorStop(1,'rgba('+rgb(c)+',0)');x.fillStyle=r;x.fillRect(0,0,32,32);return spr[c]=k}
function mk(x0,y0,b,col,o){o=o||{};const dr=!o.pf&&Math.random()<.1;PARTS.push({x0,y0,b,sp:sprite(col),pf:o.pf,dr,al:o.al||1,vx:((o.pf?20:50)+Math.random()*(o.pf?60:170))*(o.wk||1)+(o.wx||0)*(.5+Math.random()),vy:(-(10+Math.random()*50)+(Math.random()-.5)*40)*(o.wk||1)+(o.wy||0)*(.5+Math.random()),ax:(o.ax||0)*(.5+Math.random()),ay:(o.ay||0)*(.5+Math.random()),life:o.pf?1.6+Math.random()*1.2:(dr?1.4+Math.random():1+Math.random()*1.5),sz:o.pf?20+Math.random()*28:dr?1.6+Math.random()*1.8:.8+Math.random()*1.7,ph:Math.random()*6.28})}
function drawFx(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
  if(!PARTS.length)return;
  ctx.globalCompositeOperation='lighter';
  let w=0;
  for(let i=0;i<PARTS.length;i++){
    const q=PARTS[i],age=(now-q.b)/1000;
    if(age>q.life)continue;
    PARTS[w++]=q;
    if(age<0)continue;
    const m=(1-Math.exp(-age*1.6))/1.6;
    const x=q.x0+q.vx*m+Math.sin(age*2.6+q.ph)*(q.pf?22:14)*age+q.ax*age*age*.5;
    const y=q.y0+q.vy*m+(q.dr?age*age*70:-age*age*(q.pf?10:16))+Math.cos(age*2.2+q.ph)*8*age+q.ay*age*age*.5;
    let a=1-age/q.life;a=a*a*(q.pf?1.4:(.65+.35*Math.sin(age*18+q.ph)));a*=Math.min(1,age*5);
    a*=q.al;if(a<.012)continue;ctx.globalAlpha=Math.min(a,1);
    const z=q.pf?q.sz*(1+age*1.4):q.sz*(q.dr?1.6:2.6)*(1+age*.5);
    ctx.drawImage(q.sp,x-z,y-z,z*2,z*2);
  }
  PARTS.length=w;
}

/* une notification */
function mkCard(d){
  const el=document.createElement('div');el.className='cr';el.style.width=SW+'px';el.innerHTML=TPL;inner.appendChild(el);
  const q=s=>el.querySelector(s);
  const rig=q('.rig'),glass=q('.glass'),pf=q('.rim path'),hit=q('.hit'),trash=q('.trash'),ti=q('.trash svg'),acts=q('.acts'),ex=q('.ex'),ms=q('.ms'),av=q('.av'),rep=q('.rep'),inp=q('input'),snd=q('.send'),del=q('.del'),conf=q('.conf'),cbar=q('.conf i'),fill=q('.fill'),M=[glass,q('.rim'),q('.cd')];
  q('.nm').textContent=d.n;q('.tm').textContent=d.t;ms.textContent=ex.textContent=d.m;
  if(d.h!=null)q('.av i').style.background='conic-gradient(from 20deg,hsl('+d.h+',90%,66%),hsl('+(d.h+70)+',85%,60%),hsl('+(d.h+150)+',90%,66%),hsl('+(d.h+220)+',85%,64%),hsl('+d.h+',90%,66%))';
  const S={p:0,v:0,t:0,E:0,Ev:0,Et:0,e:0,ev:0,et:1,q:0,qv:0,nb:0,dk:0,R:0,Rv:0,Rt:0,Sd:0,Sv:0,St:0,w:0,wv:0,pr:0,prv:0,prt:0,cut:0,Cf:0,Cv:0,Ct:0,ct0:0,sq:0,sqv:0,Mg:0,Mgv:0,Mt:0,Fl:0,Flv:0,Ft:0,x:0,xv:0,L:0,Lv:0,Lt:1,busy:false,drag:false,raw:0,dead:false,rm:false,ds:0,g:{}};
  const C={el,S,h:80,closeAll,update,dissolve,py:0,pyv:0,ps:1,psv:0,pa:1,pav:0,ca:1,init:false,idx:0,fr:0};
  let ctm,lastTap=0,sx=0,sy=0,sp0=0,lt=0,lx=0,vel=0,vcx=0;

  function closeAll(){S.Et=0;S.Rt=0;S.Ct=0;inp.blur()}
  function still(){return !S.drag&&!S.dead&&S.nb===0&&PAIRS.every(a=>{const T=typeof a[2]==='string'?S[a[2]]:a[2];return Math.abs(S[a[0]]-T)<.001&&Math.abs(S[a[1]])<.02})}
  function destroy(){const i=cards.indexOf(C);if(i>-1)cards.splice(i,1);el.remove()}

  function render(){
    const E=Math.max(S.E,-.04),p=S.p,CW0=SW-16,Cf=Math.max(S.Cf,0);
    const ox=BASE-8*E,ch=80+90*E+52*Cf,r=30+8*E,cw=CW0+16*E-REV*p,R=ox+cw;
    C.h=ch;
    const k=clamp(p,0,1.3),ccx=(R-20)+((BASE+CW0-T/2)-(R-20))*k+S.q*10;
    const s=clamp((p-.08)*1.25,0,1.18)*(1-S.dk),jv=clamp(S.v*.015,-.25,.25);
    const rr=T/2*s,rx=rr*(1+S.q*.22+jv*.1),ry=rr*(1-S.q*.22-jv*.1);
    const g=(ccx-rx)-R,B=S.nb*clamp(g/14,0,1)*(1-clamp((g-14)/24,0,1));

    cbar.style.transform='scaleX('+(S.Ct?clamp(1-(performance.now()-S.ct0)/3500,0,1):0)+')';conf.classList.toggle('arm',!!S.Ct);
    snd.style.left=f(rw-42)+'px';snd.style.opacity=clamp(Sd*2,0,1);snd.style.transform='scale('+Sd+')';
    rep.firstElementChild.style.opacity=clamp(1-Rs*2.5,0,1);

    const on=S.R>.8&&!S.busy?'auto':'none';snd.style.pointerEvents=on;inp.style.pointerEvents=on;
    const Fl=S.Fl;
    if(Fl>.002){const fl=fill.style;fl.display='grid';fl.left=f(16*(1-Fl))+'px';fl.top=f((ch-58)*(1-Fl))+'px';fl.width=f(rw+(cw-rw)*Fl)+'px';fl.height=f(42+(ch-42)*Fl)+'px';fl.borderRadius=f(21+(r-21)*Fl)+'px'}else if(fill.style.display!=='none')fill.style.display='none';

  }

  function update(dt,now){

      const t=(now-S.ds)/1000;S.cut=clamp(t/.9,0,1);S.dk=clamp(t/.22,0,1);

      S.St=(S.Rt&&S.R>.4&&!S.busy)?1:0;
      sp(S,'R','Rv',S.Rt,250,15,h);sp(S,'Sd','Sv',S.St,300,13,h);sp(S,'w','wv',0,420,11,h);sp(S,'pr','prv',S.prt,420,24,h);
      sp(S,'Cf','Cv',S.Ct,300,14,h);sp(S,'L','Lv',S.Lt,150,17,h);
      sp(S,'sq','sqv',0,240,8,h);sp(S,'Mg','Mgv',S.Mt,260,15,h);sp(S,'Fl','Flv',S.Ft,150,13,h);
    }
    S.nb=S.drag?S.nb+(1-S.nb)*Math.min(1,dt*18):S.nb*Math.exp(-dt*11);
    if(S.nb<.004&&!S.drag)S.nb=0;
    if(still()&&!S.Ct)C.fr++;else C.fr=0;
    if(C.fr<3)render();
  }

  /* gestes */
  hit.addEventListener('pointerdown',e=>{
    if(e.target.closest('.acts')||S.dead||S.busy||S.e<.5)return;
    S.drag=true;sx=lx=e.clientX;sy=e.clientY;sp0=S.p;S.raw=S.p;vel=vcx=0;lt=performance.now();S.prt=1;
    hit.setPointerCapture(e.pointerId);hit.style.cursor='grabbing';hint.style.opacity=0;
  });
  hit.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect();
    el.style.setProperty('--sx',(e.clientX-r.left)+'px');el.style.setProperty('--sy',(e.clientY-r.top)+'px');
    if(!S.drag||S.Et||(C.idx>0&&collapsed()))return;
    const raw=sp0+(sx-e.clientX)/90;S.raw=raw;
    const np=raw>1?1+.35*(1-Math.exp(-(raw-1)*2)):raw<0?0:raw;
    const m=-raw*90;S.x=raw<0?(m<90?m:90+(m-90)*.35):0;
    const now=performance.now(),dtm=Math.max(1,now-lt)/1000;lt=now;
    vel=.7*vel+.3*((np-S.p)/dtm);vcx=.7*vcx+.3*((e.clientX-lx)/dtm);lx=e.clientX;
    if((S.p<.5)!==(np<.5))vib(8);
    S.p=np;S.v=vel;
  });
  function up(e){
    if(!S.drag)return;
    S.drag=false;S.prt=0;hit.style.cursor='grab';
    if(Math.abs(sx-e.clientX)<6&&Math.abs(sy-e.clientY)<6){
      hint.style.opacity=0;
      if(C.idx>0&&collapsed()){openStack(true);return}
      if(S.Et){if(!S.busy)closeAll()}
      else if(S.t===1){S.t=0;S.v=0}
      else{cards.forEach(c=>c!==C&&c.closeAll());S.Et=1;S.t=0;vib(6)}
      return;
    }
    if(S.Et)return;
    if(S.raw<-1.2||(S.raw<-.4&&vcx>1100)){dissolve();return}
    if(S.raw>2.2){dissolve();return}
    S.t=((S.p>.5&&vel>-2.5)||vel>2.5)?1:0;S.v=vel;if(S.t&&S.p>.85)S.qv=9;
  }
  hit.addEventListener('pointerup',up);
  hit.addEventListener('pointercancel',()=>{if(!S.drag)return;S.drag=false;S.prt=0;hit.style.cursor='grab';S.t=S.p>.5?1:0;S.v=0});
  trash.addEventListener('click',dissolve);
  conf.addEventListener('click',dissolve);
  del.addEventListener('click',()=>{
    if(S.busy||S.dead)return;
    clearTimeout(ctm);
    if(S.Ct){S.Ct=0}else{S.Ct=1;S.ct0=performance.now();S.Rt=0;inp.blur();ctm=setTimeout(()=>{S.Ct=0},3500)}
  });

  /* réponse */
  rep.addEventListener('click',()=>{
    if(S.busy||S.Ct)return;
    const n=performance.now();
    if(S.Rt){
      if(S.R>.7&&n-lastTap<400){S.Rt=0;inp.blur();lastTap=0}else lastTap=n;

  });
  function doSend(){
    if(S.busy||S.R<.8)return;
    if(!inp.value.trim()){S.wv=160;inp.focus();return}
    S.busy=true;acts.classList.add('sent');inp.blur();S.Sv-=3;S.Mt=1;vib([8,30,12]);

  }

  /* suppression en poussière */
  function dissolve(o){o=(o&&typeof o.wx==='number')?o:{};
    if(S.dead||(S.busy&&!o.force))return;

    S.ds=P0;S.cut=0;S.rev=rev;el.classList.toggle('rev',rev);el.style.setProperty('--ea','-9999px');el.style.setProperty('--eb','-9999px');el.classList.add('dis');

/* pile, mise en page et boucle */
function addCard(){
  if(cards.length>=12)return;
  cards.forEach(c=>c.closeAll());
  cards.unshift(mkCard(DATA[di++%DATA.length]));
  list.scrollTo({top:0,behavior:'smooth'});vib(8);hint.style.opacity=0;
}
$('#add').addEventListener('click',addCard);
clr.addEventListener('click',()=>{
  const live=cards.filter(c=>!c.S.dead&&!c.S.busy);if(!live.length)return;
  const wasC=collapsed();if(wasC)openStack(true);
  const ang=Math.random()*6.283,mag=200+Math.random()*180,t0=wasC?560:0,dens=clamp(1.6/live.length,.22,.8);
  live.forEach((c,i)=>{
    const a=ang+(Math.random()-.5),wx=Math.cos(a)*mag,wy=Math.sin(a)*mag;
    setTimeout(()=>c.dissolve({wx:wx*.5,wy:wy*.5,ax:wx*.9,ay:wy*.9,wk:1.5,rev:wx<0,dens}),t0+i*110+Math.random()*60);
  });
  vib([10,40,10,40,14]);
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.cr')&&!e.target.closest('#add'))cards.forEach(c=>!c.S.busy&&c.closeAll())});
addEventListener('keydown',e=>{if(e.key==='Escape')cards.forEach(c=>c.closeAll())});

const ZS={z:1,v:0},fold=$('#fold');let open=false;

let pull=0,pt;
const settle=()=>{if(pull>.32)openStack(true);pull=0};
list.addEventListener('wheel',e=>{if(!collapsed())return;pull=clamp(pull+Math.abs(e.deltaY)/240,0,1);clearTimeout(pt);pt=setTimeout(settle,170)},{passive:true});
let ty0=0;
list.addEventListener('touchstart',e=>{ty0=e.touches[0].clientY},{passive:true});
list.addEventListener('touchmove',e=>{if(collapsed())pull=clamp(Math.abs(e.touches[0].clientY-ty0)/170,0,1)},{passive:true});
list.addEventListener('touchend',()=>{if(collapsed())settle()},{passive:true});
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,1/30);last=now;
  const n=cards.length,Zt=(n<=3||open)?1:pull;

  const Z=ZS.z,H0=n?cards[0].h:80;

    const i=cards.indexOf(c);c.update(dt,now);c.idx=i;
    const k=Math.min(i,2),ss=[1,.945,.89][k],sA=i<3?1:0,sy=i===0?0:H0+14*k-c.h*ss;
    const u=(i-1)/Math.max(n-2,1),Zi=i===0?1:clamp((Z-u*.5)/.5,0,1.08),ty=sy+(y-sy)*Zi,ts=ss+(1-ss)*Zi,ta=sA+(1-sA)*Zi;
    if(!c.init){c.init=true;c.py=ty;c.ps=ts;c.pa=ta}
    for(let j=0;j<4;j++){const h=dt/4;sp(c,'py','pyv',ty,320,26,h);sp(c,'ps','psv',ts,320,26,h);sp(c,'pa','pav',ta,260,24,h)}
    c.ca=i===0?1:clamp((Zi-.3)/.5,0,1);
    const mv=Math.abs(c.py-ty)>.02||Math.abs(c.pyv)>.05||Math.abs(c.ps-ts)>.0005||Math.abs(c.pa-ta)>.002;
    if(mv)c.fr=0;
    if(mv||c.fr<3){c.el.style.transform='translate3d(0,'+f(c.py)+'px,0) scale('+c.ps.toFixed(4)+')';c.el.style.zIndex=100-i}
    
    c.el.style.pointerEvents='none';
    y+=(c.h+GAP)*Math.max(c.S.L,0);
  });
  const Hc=H0+14*Math.min(Math.max(n-1,0),2),tot=n?Hc+(y-Hc)*Z:0;
  inner.style.height=f(tot+(n>3?44:0))+'px';
  const fo=n>3?clamp((Z-.6)*2.5,0,1):0;fold.style.opacity=fo;fold.style.pointerEvents=fo>.5?'auto':'none';fold.style.transform='translateY('+f(tot+8)+'px)';
  if(n<=3)open=false;
  empty.style.opacity=cards.length?0:1;clr.classList.toggle('off',!cards.length);
  drawFx(now);
  requestAnimationFrame(loop);
}
